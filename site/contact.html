<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Team Sens</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="acceuil.html" class="logo">
                <img src="img/logo-seul.png" alt="Logo Team Sens">
            </a>
            <nav>
                <ul>
                    <li><a href="acceuil.html">Accueil</a></li>
                    <li><a href="roster.html">Rosters</a></li>
                    <li><a href="reseaux.html">Nos réseaux</a></li>
                    <li><a href="boutique.html">Boutique</a></li>
                    <li><a href="contact.html">Nous contacter</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero">  
            <h1>Contactez nous !</h1>
            <form class="contact-form" data-endpoint="http://127.0.0.1:3000/api/contact">                
                <div class="glass-form-container">                  
                    <div class="form-row">
                        <input type="email" id="contact-email" name="email" placeholder="Adresse e-mail*" required class="input-field">
                        <input type="text" id="contact-nom" name="nom" placeholder="Nom*" required class="input-field">
                    </div>

                    <div class="form-row">
                        <input type="text" id="contact-discord" name="discord" placeholder="Pseudo discord (Optionnel)" class="input-field">
                        <input type="text" id="contact-objet" name="objet" placeholder="Objet*" required class="input-field">
                    </div>
                    <textarea id="contact-message" name="message" placeholder="Votre message...*" required class="input-field textarea-field"></textarea> 
                </div>
                <button type="submit" class="btn-send">Envoyer</button>
                <p id="contact-status" class="little-comment"></p>
                <p class="little-comment">* = Champs obligatoire</p>
            </form>
        </section>
    </main>

    <footer>
        <p>Copyright - Team Sens. Tous droits réservés</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
