<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roster - LowSens</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="roster-page">
    <div id="site-navbar"></div>

    <main>
        <section class="hero roster-hero">
            <h1>Notre roster</h1>

            <div class="roster-coming-soon-card">
                <div class="roster-badge-icon">
                    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="6" y1="12" x2="10" y2="12"></line>
                        <line x1="8" y1="10" x2="8" y2="14"></line>
                        <line x1="15" y1="13" x2="15.01" y2="13"></line>
                        <line x1="18" y1="11" x2="18.01" y2="11"></line>
                        <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                    </svg>
                </div>

                <h2 class="roster-card-title">Le roster arrive bientôt !</h2>
                <p class="roster-card-desc">
                    Les recrutements et les entraînements sont en cours. La composition officielle de nos équipes <strong>LowSens</strong> sera annoncée très prochainement !
                </p>

                <a href="acceuil.html" class="btn-home">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Revenir à l'accueil</span>
                </a>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>
    <script src="script.js"></script>
</body>
</html>
