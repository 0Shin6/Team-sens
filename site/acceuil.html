<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Sens - Site Officiel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="about.html" class="logo">
                <img src="img/logo-seul.png" alt="Logo Team Sens">
            </a>
            <nav>
                <ul>
                    <li><a href="acceuil.html">Accueil</a></li>
                    <li><a href="roster.html">Rosters</a></li>
                    <li><a href="reseaux.html">Nos réseaux</a></li>
                    <li><a href="boutique.html">Boutique</a></li>
                    <li><a href="contact.html">Nous contacter</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Bienvenue sur le site officiel de la team Sens !</h1>

            <div class="widgets-container">
                <div class="widget news">
                    <h2>Actualités</h2>
                    
                    <div class="slider-content" id="news-slider">
                        <img src="" alt="Image Actu" id="news-img">
                        <p id="news-desc" style="margin-top: 15px; min-height: 50px;"></p>
                    </div>

                    <div class="slider-nav" id="news-dots"></div>
                </div>

                <div class="widget matches">
                    <h2>Prochains matchs</h2>
                    
                    <div class="slider-content" id="match-slider">
                        <div class="match-info">
                            <img src="img/logo-seul.png" alt="Team A" class="team-logo" id="match-team-a">
                            
                            <div class="match-details">
                                <span id="match-date" style="font-size: 1.2rem; display: block;"></span>
                                <span id="match-heure" style="font-size: 1.5rem;"></span>
                            </div>
                            
                            <img src="img/logo-seul.png" alt="Team B" class="team-logo" id="match-team-b">
                        </div>
                        <p class="game-type" id="match-game" style="margin-top: 10px;"></p>
                    </div>

                    <div class="slider-nav" id="match-dots"></div>
                </div>

                <div class="widget result">
                    <h2>Dernier résultat</h2>
                    <div class="result-info">
                        <img src="img/logo-seul.png" alt="Team Sens" class="team-logo">
                        <span class="team-name">Team Sens</span>
                        <span class="score">3 - 1</span>
                        <span class="team-name">Team Sang</span>
                        <img src="img/logo-seul.png" alt="Team Sang" class="team-logo">
                    </div>
                    <p class="game-type">Valorant</p>
                </div>
            </div>
    </main>

    <footer>
        <p>Copyright &copy; - Team Sens. Tous droits réservés</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
